<!DOCTYPE html>
<html>
<head>
<title>Meu Grid</title>

<style> 
 body{
    margin: 0;
 }

 container{
    display: grid;
    grid-template-columns: 1fr 3fr 1fr;
    grid-template-rows: 80px 300px 80px;
    gap: 10px;
    padding: 10px;
 }

 header{
    background-color: lightgrey;
    grid-column: 1 / 4;
    text-align: center;
    padding: 20px;
 }

 nav{
    background-color: lightblue;
    text-align: center;
    padding: 20px;
 }

  conteudo{
    background-color: plum;
    text-align: center;
    padding: 20px;
 }

 aside{
    background-color: lightblue;
    text-align: center;
    padding: 20px;
 }

 footer{
    background-color: lightgray;
    grid-column: 1 / 4;
    text-align: center;
    padding: 20px;
 }
 </style>
 </head>

 <body>

 <div class="container">
   <div class="header"><HEADER</div>

   <div class="CONTAINER">
     <div class="NAV">NAV</div>
     <div class="conteudo">CONTENTS</div>
     <div class="aside">Aside</div>

     <div class="footer"><Footer</div></div>

   </body>
   </html>
